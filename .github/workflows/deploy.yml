name: Fullstack Deploy (Firebase Hosting + Cloud Run)

on:
  push:
    branches:
      - main
      - hardening/post-launch
  workflow_dispatch:

env:
  PROJECT_ID: hnageul-copilot-dev-918
  REGION: asia-northeast3
  SERVICE_NAME: hangul-now-api
  SERVICE_ACCOUNT: hangul-now-api-runtime@hnageul-copilot-dev-918.iam.gserviceaccount.com

jobs:
  # ----------------------------------------------------
  # 1. 프론트엔드 검증, 빌드 및 Firebase Hosting 자동 배포
  # ----------------------------------------------------
  deploy-frontend:
    name: Build & Deploy Frontend (Firebase Hosting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Unit Tests
        run: |
          cd frontend
          npm ci
          npm test

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
        continue-on-error: true

  # ----------------------------------------------------
  # 2. 백엔드 컨테이너 빌드 및 Google Cloud Run 자동 배포
  # ----------------------------------------------------
  deploy-backend:
    name: Build & Deploy Backend (Cloud Run)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build Container Image via Cloud Build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud builds submit . \
            --region ${{ env.REGION }} \
            --tag "$IMAGE_TAG"

      - name: Deploy to Google Cloud Run
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --timeout 3600 \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-secrets GEMINI_API_KEY=hn-staging-gemini-api-key:latest,FIREBASE_SERVICE_ACCOUNT_KEY=hn-staging-firebase-sa-key:latest,ADMIN_EMAILS=hn-staging-admin-emails:latest

      - name: Verify Deployment Health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Deployed Service URL: $SERVICE_URL"
          curl -f -s "$SERVICE_URL/api/health" || (echo "Health check failed!" && exit 1)
