name: Deploy Hangul Now to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: hnageul-copilot-dev-918
  REGION: asia-northeast3
  SERVICE_NAME: hangul-now-api
  SERVICE_ACCOUNT: hangul-now-api-runtime@hnageul-copilot-dev-918.iam.gserviceaccount.com

jobs:
  test-and-deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 환경 설정 및 프론트엔드 테스트
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm ci
          npm test

      # 3. Google Cloud 인증
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 4. Google Cloud SDK 설정
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 5. Cloud Build를 통해 컨테이너 이미지 빌드 및 Artifact Registry 푸시
      - name: Build Container Image via Cloud Build
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud builds submit . \
            --region ${{ env.REGION }} \
            --tag "$IMAGE_TAG"

      # 6. Cloud Run에 새 버전 배포
      - name: Deploy to Google Cloud Run
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.REGION }} \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --timeout 3600 \
            --max-instances 1 \
            --allow-unauthenticated \
            --set-secrets GEMINI_API_KEY=hn-staging-gemini-api-key:latest,FIREBASE_SERVICE_ACCOUNT_KEY=hn-staging-firebase-sa-key:latest,ADMIN_EMAILS=hn-staging-admin-emails:latest

      # 7. 배포 완료 후 상태 점검
      - name: Verify Deployment Health
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Deployed Service URL: $SERVICE_URL"
          curl -f -s "$SERVICE_URL/api/health" || (echo "Health check failed!" && exit 1)
